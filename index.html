<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Karla:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#F5F7F3;
    --surface:#FFFFFF;
    --text:#171A14;
    --muted:#666C5E;
    --border:#E2E6DC;
    --accent:#1F7A5C;
    --accent-ink:#0F4A36;
    --accent-soft:#E4F0E7;
    --focus:#1F7A5C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12140F;
      --surface:#1A1D15;
      --text:#ECEFE7;
      --muted:#9BA391;
      --border:#2B2F23;
      --accent:#57C793;
      --accent-ink:#B7EBCF;
      --accent-soft:#1E2B21;
      --focus:#57C793;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12140F;
    --surface:#1A1D15;
    --text:#ECEFE7;
    --muted:#9BA391;
    --border:#2B2F23;
    --accent:#57C793;
    --accent-ink:#B7EBCF;
    --accent-soft:#1E2B21;
    --focus:#57C793;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Karla,-apple-system,"Malgun Gothic",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:36px 30px 30px;
    text-align:center;
  }

  .kicker{
    font-family:Karla,sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
  }

  h1{
    font-family:Manrope,sans-serif;
    font-weight:800;
    font-size:22px;
    line-height:1.3;
    letter-spacing:-.01em;
    margin:14px 0 8px;
    text-wrap:balance;
  }

  p{
    font-size:14.5px;
    line-height:1.6;
    color:var(--muted);
    margin:0;
  }

  .rail{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:26px 0 22px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  .dot:nth-child(2){animation-delay:.15s;}
  .dot:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{
    0%,80%,100%{opacity:.25;transform:scale(.85);}
    40%{opacity:1;transform:scale(1);}
  }
  @media (prefers-reduced-motion:reduce){
    .dot{animation:none;opacity:.7;}
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    width:100%;
    justify-content:center;
    background:var(--accent);
    color:#fff;
    font-family:Karla,sans-serif;
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    padding:13px 18px;
    border-radius:12px;
    margin-top:18px;
  }
  .cta:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .weblink{
    display:block;
    margin-top:12px;
    font-family:Karla,sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--muted);
    text-decoration:underline;
    text-underline-offset:2px;
  }

  .target{
    margin-top:14px;
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    color:var(--muted);
    word-break:break-all;
    padding:10px 12px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
  }

  .guide{
    display:none;
    margin-top:20px;
    text-align:left;
    background:var(--accent-soft);
    border-radius:12px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.65;
    color:var(--accent-ink);
  }
  .guide b{font-weight:700;}
  .guide.show{display:block;}
</style>

<div class="card">
  <div class="kicker">Deep Link Relay</div>
  <h1 id="headline">네이버로 이동하고 있어요</h1>
  <p id="sub">잠시만 기다려주시면 자동으로 연결됩니다.</p>

  <div class="rail" aria-hidden="true">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <a id="cta" class="cta" href="#">네이버 앱으로 바로 열기</a>
  <a id="webFallback" class="weblink" href="#">앱 없이 웹으로 보기</a>
  <div id="targetBox" class="target"></div>

  <div id="iosGuide" class="guide">
    자동으로 안 넘어갔다면 위 <b>"네이버 앱으로 바로 열기"</b> 버튼을 한 번 더 직접 눌러주세요.<br>
    그래도 안 되면 오른쪽 위 <b>•••</b> → <b>"다른 브라우저로 열기"</b>를 선택해주세요.
  </div>
</div>

<script>
(function(){
  // ── 상품별 짧은 이름 → 실제 링크 매핑. 새 상품 생길 때 여기에 한 줄만 추가하면 됨. ──
  //    사용법: ?p=gold-delta 처럼 짧은 이름으로 링크 공유
  var PRODUCTS = {
    "brunelle":   "https://mkt.shopping.naver.com/link/6a83f295e19f9b5a30235076", // 브루넬 (Brunelle)
    "gold-delta": "https://mkt.shopping.naver.com/link/6a83f29591e12b06b85963b7", // 골드 델타
    "evelyn":     "https://mkt.shopping.naver.com/link/6a8ef19a83e1344816cd9e3b", // 에블린 (Evelyn)
    "rose-drop":  "https://mkt.shopping.naver.com/link/6a8ef19aaeac3553bb291952"  // 로즈 드롭
    // "다음상품이름": "https://mkt.shopping.naver.com/link/...",
  };
  var DEFAULT_URL = PRODUCTS["gold-delta"]; // ?p= 없이 그냥 열었을 때 갈 기본 상품
  // ────────────────────────────────────────────────────────────────────────

  var qs = new URLSearchParams(location.search);
  var productKey = qs.get("p");
  var raw = qs.get("to"); // 매핑에 없는 링크를 급하게 한 번 쓸 때용 (인코딩 필요)
  var TARGET_URL = DEFAULT_URL;
  if (productKey && PRODUCTS[productKey]) {
    TARGET_URL = PRODUCTS[productKey];
  } else if (raw) {
    try {
      var u = new URL(raw);
      if (u.protocol === "https:" || u.protocol === "http:") TARGET_URL = u.href;
    } catch (e) { /* 잘못된 to= 값이면 기본값 사용 */ }
  }

  document.getElementById("webFallback").href = TARGET_URL;
  document.getElementById("targetBox").textContent = TARGET_URL;

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  var encodedTarget = encodeURIComponent(TARGET_URL);
  var naverAppUrl = "naversearchapp://inappbrowser?url=" + encodedTarget + "&target=new&version=6";
  var androidIntentUrl = "intent://inappbrowser?url=" + encodedTarget + "&target=new&version=6" +
    "#Intent;scheme=naversearchapp;action=android.intent.action.VIEW;" +
    "category=android.intent.category.BROWSABLE;package=com.nhn.android.search;" +
    "S.browser_fallback_url=" + encodeURIComponent(TARGET_URL) + ";end";

  var schemeUrl = isAndroid ? androidIntentUrl : naverAppUrl;
  document.getElementById("cta").href = schemeUrl;

  // ── 1) 보이지 않는 iframe으로 커스텀 스킴을 먼저 조용히 시도.
  //    location.href로 직접 쏘면 임베디드 브라우저에서 "알 수 없는 페이지"로
  //    처리되는 경우가 있어서, 네이버 공식 문서가 권장하는 iframe 방식을 씀.
  try {
    var probe = document.createElement("iframe");
    probe.style.cssText = "position:fixed;width:0;height:0;border:0;opacity:0;pointer-events:none;";
    probe.src = schemeUrl;
    document.body.appendChild(probe);
  } catch (e) { /* iframe 생성 실패 시 무시하고 버튼/웹 대체 경로로 진행 */ }

  function showFallback() {
    document.getElementById("iosGuide").classList.add("show");
    document.getElementById("headline").textContent = "네이버 앱 연결이 잘 안 되네요";
    document.getElementById("sub").textContent = "위 버튼을 다시 눌러보시거나, 웹으로 계속 진행해주세요.";
  }

  if (!isAndroid && !isIOS) {
    // PC 등: 앱 딥링크가 의미 없으니 그냥 원래 웹 링크로
    location.href = TARGET_URL;
  } else {
    // ── 2) 앱이 열리면 이 페이지는 백그라운드로 밀려나 아래 타이머는 의미가 없어짐.
    //    앱이 안 열렸을 때만(=화면이 그대로일 때만) 안내 문구를 보여줌.
    setTimeout(function () {
      if (!document.hidden) showFallback();
    }, 900);

    // ── 3) 그래도 계속 방치되면 최소한 진짜 상품 페이지(TARGET_URL)로는 도착하게 함.
    setTimeout(function () {
      if (!document.hidden) location.href = TARGET_URL;
    }, 3500);
  }
})();
</script>
